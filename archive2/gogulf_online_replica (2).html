<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>goGULF.online | Instagram Replica</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Ensure inputs don't zoom on mobile on focus */
        input[type="text"] {
            font-size: 16px; 
        }
        @media (min-width: 640px) {
            input[type="text"] {
                font-size: 14px;
            }
        }
        
        /* Instagram Like Animation */
        @keyframes heart-burst {
            0% { transform: scale(0); opacity: 0; }
            15% { transform: scale(1.2); opacity: 0.9; }
            30% { transform: scale(1); opacity: 1; }
            70% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        .animate-heart-burst {
            animation: heart-burst 1s ease-in-out forwards;
        }
    </style>
</head>
<body class="bg-[#f0fdf4] min-h-screen text-black font-sans antialiased flex selection:bg-black selection:text-white">

        <button class="p-2 flex-1 flex justify-center hover:bg-[#f0fdf4] transition-colors"><i data-lucide="home" class="w-6 h-6"></i></button>
        <button class="p-2 flex-1 flex justify-center hover:bg-[#f0fdf4] transition-colors"><i data-lucide="search" class="w-6 h-6"></i></button>
        <button class="p-2 flex-1 flex justify-center hover:bg-[#f0fdf4] transition-colors"><i data-lucide="film" class="w-6 h-6"></i></button>
        <button class="p-2 flex-1 flex justify-center hover:bg-[#f0fdf4] transition-colors"><i data-lucide="message-circle" class="w-6 h-6"></i></button>
        <button class="p-2 flex-1 flex justify-center hover:bg-[#f0fdf4] transition-colors"><i data-lucide="plus-square" class="w-6 h-6"></i></button>
        <button class="p-2 flex-1 flex justify-center hover:bg-[#f0fdf4] transition-colors">
            <img src="https://i.pravatar.cc/150?u=1" alt="Profile" class="w-6 h-6 rounded-full border border-cyan-200" />
        </button>

    <!-- Desktop Sidebar -->
    <aside class="hidden sm:flex flex-col w-[72px] xl:w-64 border-r border-cyan-200 h-screen fixed left-0 top-0 bg-white z-50 py-4 xl:px-4 shrink-0 transition-all duration-300 text-black font-sans">
        <div class="mb-8 mt-4 flex items-center justify-center xl:justify-start xl:px-2 cursor-pointer h-14">
            <!-- Brand Logo for XL screens -->
            <div class="hidden xl:flex flex-col select-none">
                <span class="font-extrabold text-xl tracking-tight text-black leading-none">
                    goGULF.online
                </span>
                <span class="text-[10px] font-bold text-gray-800 mt-[2px]">
                    by Rabbani's
                </span>
                <span class="text-[11px] italic text-gray-600 mt-1 font-semibold">
                    naukri 9 minute me !
                </span>
            </div>
            <!-- Brand Logo for smaller screens -->
            <div class="xl:hidden font-extrabold text-2xl text-black">
                gG
            </div>
        </div>

        <div class="flex-1 flex flex-col space-y-1 xl:space-y-2 w-full px-2 xl:px-0 mt-2">
            <!-- Nav Items -->
            <button class="flex items-center justify-center xl:justify-start w-full p-3 rounded-lg hover:bg-[#f0fdf4] transition-colors group font-bold text-black">
                <div class="relative group-hover:scale-105 transition-transform"><i data-lucide="home" class="w-6 h-6 xl:mr-4"></i></div>
                <span class="hidden xl:block text-base">Home</span>
            </button>
            <button class="flex items-center justify-center xl:justify-start w-full p-3 rounded-lg hover:bg-[#f0fdf4] transition-colors group font-normal">
                <div class="relative group-hover:scale-105 transition-transform"><i data-lucide="search" class="w-6 h-6 xl:mr-4"></i></div>
                <span class="hidden xl:block text-base">Search</span>
            </button>
            <button class="flex items-center justify-center xl:justify-start w-full p-3 rounded-lg hover:bg-[#f0fdf4] transition-colors group font-normal">
                <div class="relative group-hover:scale-105 transition-transform"><i data-lucide="compass" class="w-6 h-6 xl:mr-4"></i></div>
                <span class="hidden xl:block text-base">Explore</span>
            </button>
            <button class="flex items-center justify-center xl:justify-start w-full p-3 rounded-lg hover:bg-[#f0fdf4] transition-colors group font-normal">
                <div class="relative group-hover:scale-105 transition-transform"><i data-lucide="film" class="w-6 h-6 xl:mr-4"></i></div>
                <span class="hidden xl:block text-base">Reels</span>
            </button>
            <button class="flex items-center justify-center xl:justify-start w-full p-3 rounded-lg hover:bg-[#f0fdf4] transition-colors group font-normal">
                <div class="relative group-hover:scale-105 transition-transform"><i data-lucide="message-circle" class="w-6 h-6 xl:mr-4"></i></div>
                <span class="hidden xl:block text-base">Messages</span>
            </button>
            <button class="flex items-center justify-center xl:justify-start w-full p-3 rounded-lg hover:bg-[#f0fdf4] transition-colors group font-normal">
                <div class="relative group-hover:scale-105 transition-transform"><i data-lucide="heart" class="w-6 h-6 xl:mr-4"></i></div>
                <span class="hidden xl:block text-base">Notifications</span>
            </button>
            <button class="flex items-center justify-center xl:justify-start w-full p-3 rounded-lg hover:bg-[#f0fdf4] transition-colors group font-normal">
                <div class="relative group-hover:scale-105 transition-transform"><i data-lucide="plus-square" class="w-6 h-6 xl:mr-4"></i></div>

            </button>
            <button class="flex items-center justify-center xl:justify-start w-full p-3 rounded-lg hover:bg-[#f0fdf4] transition-colors group font-normal">

                    <img src="https://i.pravatar.cc/150?u=1" alt="Profile" class="w-6 h-6 rounded-full xl:mr-4 border border-cyan-200" />
                </div>
                <span class="hidden xl:block text-base">Profile</span>
            </button>
        </div>

        <div class="mt-auto px-2 xl:px-0 mb-4">
            <button class="flex items-center justify-center xl:justify-start w-full p-3 rounded-lg hover:bg-[#f0fdf4] transition-colors group">

    <main class="flex-1 w-full pt-14 sm:pt-0 sm:ml-[72px] xl:ml-64 flex justify-center">
        <div class="flex w-full max-w-4xl justify-center xl:justify-start">
            
            <!-- Feed Column -->
            <div class="w-full max-w-[470px] flex flex-col items-center">
                
                <!-- Stories Container -->
                <div class="w-full bg-white sm:bg-transparent border-b sm:border-0 sm:border-b-cyan-200 py-3 sm:py-4 px-0 sm:mb-6 sm:mt-6 max-w-full overflow-hidden">
                    <div id="stories-container" class="flex space-x-4 overflow-x-auto px-4 pb-2 scrollbar-hide">
                        <!-- Stories injected by JS -->
                    </div>
                </div>

                <!-- Posts Container -->
                <div id="posts-container" class="w-full flex flex-col items-center space-y-4 pb-20 sm:pb-8">
                    <!-- Posts injected by JS -->
                </div>
            </div>

            <!-- Right Sidebar Suggestions -->
            <div class="hidden lg:block w-[320px] pt-8 pl-8 pr-4 text-black font-sans">
                <!-- User Profile Mini -->
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center space-x-4 cursor-pointer">
                        <img src="https://i.pravatar.cc/150?u=1" alt="Your profile" class="w-11 h-11 rounded-full border border-cyan-200" />
                        <div>
                            <p class="text-sm font-semibold">your_username</p>

                    <button class="text-xs font-semibold text-black hover:text-gray-600 transition-colors">Switch</button>
                </div>

                <div class="flex items-center justify-between mb-4">
                    <p class="text-sm font-semibold text-gray-500">Suggested for you</p>
                    <button class="text-xs font-semibold hover:text-gray-600 transition-colors">See All</button>
                </div>

                <!-- Suggestions List -->
                <div id="suggestions-container" class="space-y-4">
                    <!-- Suggestions injected by JS -->
                </div>

                <!-- Footer Links -->
                <div class="mt-8">
                    <div class="flex flex-wrap gap-x-2 gap-y-1 text-xs text-gray-400">
                        <a href="#" class="hover:underline">About</a><span>·</span>
                        <a href="#" class="hover:underline">Help</a><span>·</span>

                        <a href="#" class="hover:underline">Locations</a><span>·</span>
                        <a href="#" class="hover:underline">Language</a><span>·</span>

                    </p>
                </div>

        </div>
    </main>

    <script>
        // Mock Data Initialization
        let mockStories = [
            { id: 1, username: 'your_story', avatar: 'https://i.pravatar.cc/150?u=1', isUser: true, hasUnseen: false },
            { id: 2, username: 'nature_lover', avatar: 'https://i.pravatar.cc/150?u=2', hasUnseen: true },
            { id: 3, username: 'tech_guru', avatar: 'https://i.pravatar.cc/150?u=3', hasUnseen: true },
            { id: 4, username: 'foodie_delight', avatar: 'https://i.pravatar.cc/150?u=4', hasUnseen: false },
            { id: 5, username: 'travel_bug', avatar: 'https://i.pravatar.cc/150?u=5', hasUnseen: true },
            { id: 6, username: 'fitness_junkie', avatar: 'https://i.pravatar.cc/150?u=6', hasUnseen: true },
            { id: 7, username: 'art_daily', avatar: 'https://i.pravatar.cc/150?u=7', hasUnseen: false },
            { id: 8, username: 'music_vibes', avatar: 'https://i.pravatar.cc/150?u=8', hasUnseen: true },
        ];

        let mockPosts = [
            {
                id: 1,
                username: 'nature_lover',
                avatar: 'https://i.pravatar.cc/150?u=2',
                location: 'Yosemite National Park',
                imageUrl: 'https://images.unsplash.com/photo-1426604966848-d7adac402bff?auto=format&fit=crop&q=80&w=1000',
                likes: 1245,
                caption: 'Majestic views everywhere you look. #yosemite #nature #hiking',
                comments: [
                    { id: 1, username: 'travel_bug', text: 'Stunning!' },
                    { id: 2, username: 'hiker_joe', text: 'Was there last week!' }
                ],
                timeAgo: '2 HOURS AGO',
                isLiked: false,
                isSaved: false
            },
            {
                id: 2,
                username: 'tech_guru',
                avatar: 'https://i.pravatar.cc/150?u=3',
                location: 'Silicon Valley',
                imageUrl: 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&q=80&w=1000',
                likes: 892,
                caption: 'My new setup is finally complete! 💻🚀 #workspace #developer #coding',
                comments: [
                    { id: 1, username: 'dev_guy', text: 'Clean setup!' }
                ],
                timeAgo: '5 HOURS AGO',
                isLiked: true,
                isSaved: true
            },
            {
                id: 3,
                username: 'foodie_delight',
                avatar: 'https://i.pravatar.cc/150?u=4',
                location: 'Luigi\'s Pizzeria',
                imageUrl: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&q=80&w=1000',
                likes: 3421,
                caption: 'The best slice in town! 🍕 #pizza #foodporn #yummy',
                comments: [
                    { id: 1, username: 'pizza_lover', text: 'Looks amazing!' },
                    { id: 2, username: 'hungry_hippo', text: 'I need this right now.' },
                    { id: 3, username: 'chef_boy', text: 'Classic margherita, perfect.' }
                ],
                timeAgo: '1 DAY AGO',
                isLiked: false,
                isSaved: false
            }
        ];

        let mockSuggestions = [
            { id: 1, username: 'photography_hub', avatar: 'https://i.pravatar.cc/150?u=10', reason: 'Followed by tech_guru + 2 more', isFollowing: false },
            { id: 2, username: 'sneaker_head', avatar: 'https://i.pravatar.cc/150?u=11', reason: 'Suggested for you', isFollowing: false },
            { id: 3, username: 'coffee_addict', avatar: 'https://i.pravatar.cc/150?u=12', reason: 'New to Instagram', isFollowing: false },
            { id: 4, username: 'puppy_love', avatar: 'https://i.pravatar.cc/150?u=13', reason: 'Followed by nature_lover', isFollowing: false },
            { id: 5, username: 'vintage_style', avatar: 'https://i.pravatar.cc/150?u=14', reason: 'Suggested for you', isFollowing: false },
        ];

        function renderStories() {
            const container = document.getElementById('stories-container');
            container.innerHTML = mockStories.map(story => `
                <div class="flex flex-col items-center flex-shrink-0 cursor-pointer max-w-[70px] sm:max-w-[80px]" onclick="viewStory(${story.id})">
                    <div class="relative w-16 h-16 sm:w-16 sm:h-16 rounded-full p-[2px] transition-all duration-300 ${story.hasUnseen ? 'bg-gradient-to-tr from-[#86efac] via-[#4ade80] to-[#22c55e]' : 'bg-gray-300'}">
                        <div class="bg-white p-[2px] rounded-full w-full h-full">
                            <img src="${story.avatar}" alt="${story.username}" class="w-full h-full rounded-full object-cover" />
                        </div>
                        ${story.isUser ? `
                            <div class="absolute bottom-0 right-0 bg-[#15803d] rounded-full border-2 border-white w-5 h-5 flex items-center justify-center">
                                <i data-lucide="plus" class="w-3 h-3 text-white"></i>
                            </div>
                        ` : ''}
                    </div>
                    <span class="text-xs mt-1 truncate w-full text-center text-black tracking-tight ${story.hasUnseen ? 'font-semibold' : 'text-gray-500'}">
                        ${story.username}
                    </span>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function renderSuggestions() {
            const container = document.getElementById('suggestions-container');
            container.innerHTML = mockSuggestions.map(user => `
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3 cursor-pointer">
                        <img src="${user.avatar}" alt="${user.username}" class="w-8 h-8 rounded-full border border-cyan-200" />
                        <div>
                            <p class="text-sm font-semibold hover:text-gray-600 transition-colors">${user.username}</p>
                            <p class="text-xs text-gray-500 truncate w-[160px]">${user.reason}</p>
                        </div>
                    </div>
                    <button 
                        onclick="toggleFollow(${user.id})"
                        class="text-xs font-semibold transition-colors ${user.isFollowing ? 'text-gray-500 hover:text-gray-400' : 'text-black hover:text-gray-600'}">
                        ${user.isFollowing ? 'Following' : 'Follow'}
                    </button>
                </div>
            `).join('');
        }

        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = mockPosts.map(post => `
                <div class="bg-white border-b sm:border border-cyan-200 sm:rounded-sm sm:mb-4 max-w-lg w-full mx-auto sm:max-w-xl pb-3 text-black font-sans">
                    <!-- Post Header -->
                    <div class="flex items-center justify-between p-3">
                        <div class="flex items-center space-x-3 cursor-pointer">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-[#86efac] to-[#22c55e] p-[2px]">
                                <img src="${post.avatar}" alt="${post.username}" class="w-full h-full rounded-full border-2 border-white object-cover" />
                            </div>
                            <div>
                                <p class="text-sm font-semibold hover:text-gray-600 transition-colors">${post.username}</p>
                                ${post.location ? `<p class="text-xs text-gray-500">${post.location}</p>` : ''}
                            </div>
                        </div>
                        <button class="text-gray-600 hover:text-black transition-colors">
                            <i data-lucide="more-horizontal" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <!-- Post Image with Overlay Heart -->
                    <div class="w-full bg-[#f0fdf4] flex items-center justify-center relative overflow-hidden group select-none" style="min-height: 300px;">
                        <img 
                            src="${post.imageUrl}" 
                            alt="Post content" 
                            class="w-full h-auto object-cover max-h-[600px] cursor-pointer"
                            ondblclick="handleDoubleClick(${post.id})"
                        />
                        <!-- Big Heart Overlay -->
                        <div id="big-heart-${post.id}" class="absolute hidden flex items-center justify-center z-10 pointer-events-none drop-shadow-2xl">
                            <svg aria-label="Like" color="white" fill="white" height="100" role="img" viewBox="0 0 48 48" width="100">
                                <path d="M34.6 3.1c-4.5 0-7.9 1.8-10.6 5.6-2.7-3.7-6.1-5.5-10.6-5.5C6 3.1 0 9.6 0 17.6c0 7.3 5.4 12 10.6 16.5.6.5 1.3 1.1 1.9 1.7l2.3 2c4.4 3.9 6.6 5.9 7.6 6.5.5.3 1.1.5 1.6.5s1.1-.2 1.6-.5c1-.6 2.8-2.2 7.8-6.8l2-1.8c.7-.6 1.3-1.2 2-1.7C42.7 29.6 48 25 48 17.6c0-8-6-14.5-13.4-14.5z"></path>
                            </svg>
                        </div>
                    </div>

                    <!-- Post Actions -->
                    <div class="px-3 pt-3 flex justify-between items-center">
                        <div class="flex space-x-4">
                            <button onclick="toggleLike(${post.id})" class="hover:opacity-50 transition-opacity">
                                <i data-lucide="heart" 
                                   class="w-6 h-6 ${post.isLiked ? 'text-[#ed4956] animate-pulse' : ''}" 
                                   fill="${post.isLiked ? '#ed4956' : 'none'}">
                                </i>
                            </button>
                            <button class="hover:opacity-50 transition-opacity">
                                <i data-lucide="message-circle" class="w-6 h-6 -scale-x-100"></i>
                            </button>
                            <button class="hover:opacity-50 transition-opacity">
                                <i data-lucide="send" class="w-6 h-6"></i>
                            </button>
                        </div>
                        <button onclick="toggleSave(${post.id})" class="hover:opacity-50 transition-opacity">
                            <i data-lucide="bookmark" 
                               class="w-6 h-6"
                               fill="${post.isSaved ? 'currentColor' : 'none'}">
                            </i>
                        </button>
                    </div>

                    <!-- Likes -->
                    <div class="px-3 mt-2">
                        <p class="text-sm font-semibold cursor-pointer">${post.likes.toLocaleString()} likes</p>
                    </div>

                    <!-- Caption -->
                    <div class="px-3 mt-1">
                        <p class="text-sm">
                            <span class="font-semibold cursor-pointer hover:text-gray-600 mr-2">${post.username}</span>
                            ${post.caption}
                        </p>
                    </div>

                    <!-- Comments dynamically rendered -->
                    <div class="px-3 mt-1">
                        ${post.comments.length > 2 ? `
                            <p class="text-sm text-gray-500 cursor-pointer hover:text-black mb-1">
                                View all ${post.comments.length} comments
                            </p>
                        ` : ''}
                        ${post.comments.map(comment => `
                            <p class="text-sm mt-1">
                                <span class="font-semibold cursor-pointer hover:text-gray-600 mr-2">${comment.username}</span>
                                ${comment.text}
                            </p>
                        `).join('')}
                    </div>

                    <!-- Time -->
                    <div class="px-3 mt-2 mb-2">
                        <p class="text-[10px] text-gray-500 uppercase tracking-wide">${post.timeAgo}</p>
                    </div>

                    <!-- Add Comment Section -->
                    <div class="hidden sm:flex px-3 pt-3 border-t border-cyan-200 items-center">
                        <button class="p-1 pr-3">
                            <i data-lucide="smile" class="w-5 h-5 text-gray-600 hover:text-black transition-colors"></i>
                        </button>
                        <input 
                            id="comment-input-${post.id}"
                            type="text" 
                            placeholder="Add a comment..." 
                            class="flex-1 text-sm bg-transparent outline-none placeholder-gray-500 text-black"
                            onkeypress="handleCommentKeyPress(event, ${post.id})"
                            oninput="togglePostButton(${post.id})"
                        />
                        <button 
                            id="comment-btn-${post.id}"
                            onclick="submitComment(${post.id})"
                            class="text-emerald-700 font-semibold text-sm opacity-50 cursor-default transition-all pointer-events-none">
                            Post
                        </button>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        window.viewStory = function(storyId) {
            mockStories = mockStories.map(story => {
                if (story.id === storyId) {
                    return { ...story, hasUnseen: false };
                }
                return story;
            });
            renderStories();
        };

        window.toggleFollow = function(userId) {
            mockSuggestions = mockSuggestions.map(user => {
                if (user.id === userId) {
                    return { ...user, isFollowing: !user.isFollowing };
                }
                return user;
            });
            renderSuggestions();
        };

        window.togglePostButton = function(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const btn = document.getElementById(`comment-btn-${postId}`);
            if (input && input.value.trim().length > 0) {
                btn.classList.remove('opacity-50', 'cursor-default', 'pointer-events-none');
                btn.classList.add('cursor-pointer', 'hover:text-emerald-900');
            } else if (btn) {
                btn.classList.add('opacity-50', 'cursor-default', 'pointer-events-none');
                btn.classList.remove('cursor-pointer', 'hover:text-emerald-900');
            }
        };

        window.submitComment = function(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            if (!input) return;
            const text = input.value.trim();
            if (text) {
                mockPosts = mockPosts.map(post => {
                    if (post.id === postId) {
                        return {
                            ...post,
                            comments: [...post.comments, { id: Date.now(), username: 'your_username', text }]
                        };
                    }
                    return post;
                });
                renderPosts();
            }
        };

        window.handleCommentKeyPress = function(event, postId) {
            if (event.key === 'Enter') {
                event.preventDefault();
                submitComment(postId);
            }
        };

        window.handleDoubleClick = function(postId) {
            let changed = false;
            mockPosts = mockPosts.map(post => {
                if (post.id === postId && !post.isLiked) {
                    changed = true;
                    return { ...post, isLiked: true, likes: post.likes + 1 };
                }
                return post;
            });

            if (changed) {
                renderPosts();
            }

            const heartOverlay = document.getElementById(`big-heart-${postId}`);
            if (heartOverlay) {
                heartOverlay.classList.remove('hidden');
                heartOverlay.classList.add('animate-heart-burst');
                setTimeout(() => {
                    const activeHeart = document.getElementById(`big-heart-${postId}`);
                    if (activeHeart) {
                        activeHeart.classList.add('hidden');
                        activeHeart.classList.remove('animate-heart-burst');
                    }
                }, 1000);
            }
        };

        window.toggleLike = function(postId) {
            mockPosts = mockPosts.map(post => {
                if (post.id === postId) {
                    return { 
                        ...post, 
                        isLiked: !post.isLiked,
                        likes: post.isLiked ? post.likes - 1 : post.likes + 1
                    };
                }
                return post;
            });
            renderPosts();
        };

        window.toggleSave = function(postId) {
            mockPosts = mockPosts.map(post => {
                if (post.id === postId) {
                    return { ...post, isSaved: !post.isSaved };
                }
                return post;
            });
            renderPosts();
        };

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            renderStories();
            renderSuggestions();
            renderPosts();
            lucide.createIcons();
        });
    </script>
</body>
</html>

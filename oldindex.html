        function typeWriterEffect() {
            if (!isAppReady || activeTab !== 'home') return; 
            
            const inputEl = document.getElementById('ai-search-input');
            const locInputEl = document.getElementById('ai-loc-input');
            if (!inputEl || !locInputEl) return;

            const currentPhrase = searchExamples[exampleIdx];
            
            const segmenter = new Intl.Segmenter('en', { granularity: 'grapheme' });
            const segments = Array.from(segmenter.segment(currentPhrase)).map(s => s.segment);

            if (isTypingDeleting) {
                charIdx--;
            } else {
                charIdx++;
            }

            const currentStr = segments.slice(0, charIdx).join('');
            
            if(exampleIdx % 2 === 0) {
                inputEl.placeholder = "e.g. " + currentStr;
                locInputEl.placeholder = "Where? All Countries";
            } else {
                inputEl.placeholder = "What are you looking for?";
                locInputEl.placeholder = "e.g. " + currentStr;
            }

            let typeSpeed = isTypingDeleting ? 40 : 80;

            if (!isTypingDeleting && charIdx === segments.length) {
                typeSpeed = 2000; 
                isTypingDeleting = true;
            } else if (isTypingDeleting && charIdx === 0) {

            }
            
            lucide.createIcons();
            updateBottomNav();
            lucide.createIcons();
        }

        window.onload = function() {
            setupMenuLinks();
            
            document.getElementById('app-header').style.display = 'none';
            document.getElementById('bottom-nav-wrapper').style.display = 'none';
            
            renderApp();
            
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.classList.add('opacity-0');
                    setTimeout(() => {
                        splash.style.display = 'none';
                        isAppReady = true;
                        
                        if (activeTab === 'home') {
                            startTypewriter();
                            
                            setTimeout(() => {
                                const nav = document.getElementById('bottom-nav');
                                if (nav) {
                                    nav.scrollBy({ left: 120, behavior: 'smooth' });
                                    setTimeout(() => {
                                        nav.scrollBy({ left: -120, behavior: 'smooth' });
                                    }, 800);
                                }
                            }, 500);
                        }

                    }, 700); 
                }
            }, 2500); 
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoGulf - The Trailer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #movieContainer {
            position: relative;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background: #000;
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.2);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10;
            transition: opacity 0.5s;
        }
        h1 {
            font-size: 3vw;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 200, 255, 0.8);
        }
        p.subtitle {
            font-size: 1.2vw;
            color: #aaa;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        button {
            padding: 15px 40px;
            font-size: 1.5vw;
            font-weight: bold;
            background: linear-gradient(45deg, #0055ff, #00aaff);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.8);
        }
        #cinematicBars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .bar {
            width: 100%;
            height: 12%;
            background: black;
        }
    </style>
</head>
<body>

    <div id="movieContainer">
        <canvas id="movieCanvas" width="1280" height="720"></canvas>
        <div id="cinematicBars">
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <div id="uiLayer">
            <h1>GoGulf.online</h1>
            <p class="subtitle">A Cinematic Journey by Rabbani's</p>
            <button id="playBtn">Watch Trailer</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('movieCanvas');
        const ctx = canvas.getContext('2d');
        const playBtn = document.getElementById('playBtn');
        const uiLayer = document.getElementById('uiLayer');

        let isPlaying = false;
        let startTime = 0;
        let animationFrameId;

        // Trailer Timeline (ms) - Total ~ 105 seconds
        const T = {
            TITLE_1: { s: 0, e: 4000 },       // IN A WORLD...
            GLOOM: { s: 4000, e: 14000 },     // Gloomy city, unemployment
            TITLE_2: { s: 14000, e: 17000 },  // HOPE ARRIVES
            ARRIVAL: { s: 17000, e: 28000 },  // Ship descends, shake
            TITLE_3: { s: 28000, e: 31000 },  // GOGULF BY RABBANI'S
            BOARDING: { s: 31000, e: 38000 }, // People beam up
            MONTAGE_1: { s: 38000, e: 43000 },// SAUDI / DESERT
            MONTAGE_2: { s: 43000, e: 48000 },// DUBAI / BURJ KHALIFA
            MONTAGE_3: { s: 48000, e: 53000 },// EUROPE / EIFFEL
            MONTAGE_4: { s: 53000, e: 58000 },// CANADA / CN TOWER
            TITLE_4: { s: 58000, e: 62000 },  // THE RETURN
            INDIA: { s: 62000, e: 74000 },    // India, bright, happy, Taj
            DEPARTURE: {s: 74000, e: 82000 }, // Ship warp speed away
            END_CARD: { s: 82000, e: 95000 }  // www.gogulf.online
        };

        const TOTAL_DURATION = 95000;

        // Particles for rain/stars
        let particles = [];
        for(let i=0; i<200; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                speed: 1 + Math.random() * 5,
                size: Math.random() * 2
            });
        }

        playBtn.addEventListener('click', () => {
            uiLayer.style.opacity = '0';
            setTimeout(() => {
                uiLayer.style.display = 'none';
                startTrailer();
            }, 500);
        });

        function startTrailer() {
            isPlaying = true;
            startTime = performance.now();
            requestAnimationFrame(drawLoop);
        }

        // --- DRAWING HELPERS ---

        function drawTrailerText(text1, text2, alpha) {
            ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
            ctx.shadowBlur = 20;
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.font = 'bold 50px "Impact", sans-serif';
            ctx.letterSpacing = "5px"; // Note: letterSpacing in canvas requires modern browsers
            canvas.style.letterSpacing = "8px"; // CSS fallback
            
            if (text2) {
                ctx.fillText(text1, canvas.width/2, canvas.height/2 - 40);
                ctx.fillStyle = `rgba(0, 150, 255, ${alpha})`; // Blue highlight for second line
                ctx.fillText(text2, canvas.width/2, canvas.height/2 + 40);
            } else {
                ctx.fillText(text1, canvas.width/2, canvas.height/2);
            }
            ctx.shadowBlur = 0;
            canvas.style.letterSpacing = "normal";
        }

        function drawCitySkyline(color, heightOffset = 0) {
            ctx.fillStyle = color;
            const buildings = [
                {x: 50, w: 100, h: 300}, {x: 160, w: 80, h: 450}, {x: 250, w: 120, h: 200},
                {x: 400, w: 150, h: 500}, {x: 570, w: 90, h: 350}, {x: 680, w: 110, h: 250},
                {x: 820, w: 140, h: 400}, {x: 980, w: 100, h: 550}, {x: 1100, w: 130, h: 300}
            ];
            buildings.forEach(b => {
                ctx.fillRect(b.x, canvas.height - b.h + heightOffset, b.w, b.h);
            });
        }

        function drawRain() {
            ctx.strokeStyle = 'rgba(150, 150, 150, 0.5)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            particles.forEach(p => {
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x - 5, p.y + p.speed * 4);
                p.y += p.speed * 4;
                p.x -= 2;
                if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width + 100; }
            });
            ctx.stroke();
        }

        function drawStars(speedMult) {
            ctx.fillStyle = 'white';
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                p.x -= p.speed * speedMult;
                if (p.x < 0) p.x = canvas.width;
            });
        }

        function drawPeople(xOffset, yOffset, state) {
            const numPeople = 8;
            ctx.fillStyle = state === 'sad' ? '#222' : '#000';
            for(let i=0; i<numPeople; i++) {
                let px = 200 + i * 120 + xOffset;
                let py = canvas.height - 100 + yOffset;
                // Head
                ctx.beginPath();
                ctx.arc(px, py - 30, 10, 0, Math.PI*2);
                ctx.fill();
                // Body
                ctx.fillRect(px - 5, py - 20, 10, 30);
                // Legs
                ctx.beginPath();
                ctx.moveTo(px, py + 10); ctx.lineTo(px - 10, py + 40);
                ctx.moveTo(px, py + 10); ctx.lineTo(px + 10, py + 40);
                // Arms (drooping if sad, raised if happy)
                if (state === 'sad') {
                    ctx.moveTo(px, py - 10); ctx.lineTo(px - 15, py + 15);
                    ctx.moveTo(px, py - 10); ctx.lineTo(px + 15, py + 15);
                } else {
                    ctx.moveTo(px, py - 10); ctx.lineTo(px - 20, py - 30);
                    ctx.moveTo(px, py - 10); ctx.lineTo(px + 20, py - 30);
                }
                ctx.strokeStyle = ctx.fillStyle;
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        function drawShip(x, y, scale = 1, glowing = false, thruster = 0) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Glow
            if (glowing) {
                ctx.shadowColor = '#00aaff';
                ctx.shadowBlur = 50 + Math.sin(Date.now() / 100) * 20;
            }

            // Ship Body
            ctx.fillStyle = '#111';
            ctx.strokeStyle = '#0055ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(0, 0, 150, 40, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Cockpit
            ctx.fillStyle = 'rgba(0, 200, 255, 0.8)';
            ctx.beginPath();
            ctx.ellipse(30, -15, 60, 25, 0, Math.PI, Math.PI*2);
            ctx.fill();

            // Text on ship
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("GOGULF.ONLINE", -20, 10);
            ctx.font = '10px Arial';
            ctx.fillStyle = '#aaa';
            ctx.fillText("BY RABBANI'S", -20, 25);

            // Thruster
            if (thruster > 0) {
                const gradient = ctx.createLinearGradient(-150, 0, -150 - thruster, 0);
                gradient.addColorStop(0, 'rgba(0, 200, 255, 1)');
                gradient.addColorStop(1, 'rgba(0, 200, 255, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.moveTo(-150, -10);
                ctx.lineTo(-150 - thruster, 0);
                ctx.lineTo(-150, 10);
                ctx.fill();
            }

            // Beam (optional)
            if (scale === 1.5) { // Assuming scale 1.5 is boarding phase
                 const beamGrad = ctx.createLinearGradient(0, 40, 0, 400);
                 beamGrad.addColorStop(0, 'rgba(0, 255, 255, 0.8)');
                 beamGrad.addColorStop(1, 'rgba(0, 255, 255, 0)');
                 ctx.fillStyle = beamGrad;
                 ctx.beginPath();
                 ctx.moveTo(-50, 40);
                 ctx.lineTo(50, 40);
                 ctx.lineTo(150, 400);
                 ctx.lineTo(-150, 400);
                 ctx.fill();
            }

            ctx.restore();
        }

        // --- LANDMARKS ---
        function drawBurjKhalifa(x, y) {
            ctx.fillStyle = '#112';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + 20, y + 100);
            ctx.lineTo(x + 40, y + 300);
            ctx.lineTo(x + 60, y + 600);
            ctx.lineTo(x - 60, y + 600);
            ctx.lineTo(x - 40, y + 300);
            ctx.lineTo(x - 20, y + 100);
            ctx.fill();
            ctx.fillStyle = '#334';
            ctx.fillRect(x - 2, y - 50, 4, 50); // Spire
        }

        function drawEiffelTower(x, y) {
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + 80, y + 500);
            ctx.moveTo(x, y);
            ctx.lineTo(x - 80, y + 500);
            ctx.stroke();
            // Cross bars
            ctx.fillRect(x - 30, y + 200, 60, 10);
            ctx.fillRect(x - 50, y + 350, 100, 15);
        }

        function drawCNTower(x, y) {
            ctx.fillStyle = '#333';
            ctx.fillRect(x - 10, y + 150, 20, 450); // Base
            ctx.fillRect(x - 2, y, 4, 150); // Spire
            // Pod
            ctx.beginPath();
            ctx.ellipse(x, y + 150, 40, 20, 0, 0, Math.PI*2);
            ctx.fill();
        }

        function drawTajMahal(x, y) {
            ctx.fillStyle = '#f5f5dc'; // Off-white/cream
            // Main Base
            ctx.fillRect(x - 200, y + 150, 400, 150);
            // Main Dome
            ctx.beginPath();
            ctx.arc(x, y + 100, 80, Math.PI, 0);
            ctx.fill();
            // Side Domes
            ctx.beginPath(); ctx.arc(x - 100, y + 120, 40, Math.PI, 0); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 100, y + 120, 40, Math.PI, 0); ctx.fill();
            // Pillars
            ctx.fillRect(x - 250, y + 50, 20, 250);
            ctx.fillRect(x + 230, y + 50, 20, 250);
        }

        // --- MAIN LOOP ---

        function drawLoop() {
            if (!isPlaying) return;
            const elapsed = performance.now() - startTime;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save(); // Save base state

            // Determine Scene
            if (elapsed < T.TITLE_1.e) {
                // IN A WORLD
                let alpha = Math.min(1, elapsed / 1000);
                if (elapsed > T.TITLE_1.e - 1000) alpha = (T.TITLE_1.e - elapsed) / 1000;
                drawTrailerText("IN A WORLD...", "PLAGUED BY UNEMPLOYMENT", alpha);

            } else if (elapsed < T.GLOOM.e) {
                // GLOOMY CITY
                const sceneT = elapsed - T.GLOOM.s;
                
                // Camera slow pan
                ctx.translate(-sceneT * 0.01, 0);
                
                // Background
                const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grad.addColorStop(0, '#0a0a0a');
                grad.addColorStop(1, '#222');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width + 500, canvas.height);
                
                drawCitySkyline('#111');
                drawPeople(0, 0, 'sad');
                drawRain();

            } else if (elapsed < T.TITLE_2.e) {
                // HOPE ARRIVES
                let alpha = Math.min(1, (elapsed - T.TITLE_2.s) / 500);
                if (elapsed > T.TITLE_2.e - 500) alpha = (T.TITLE_2.e - elapsed) / 500;
                drawTrailerText("THEN...", "ONE SPACECRAFT CAME", alpha);

            } else if (elapsed < T.ARRIVAL.e) {
                // ARRIVAL
                const sceneT = elapsed - T.ARRIVAL.s;
                
                // Screen shake
                if (sceneT > 2000 && sceneT < 6000) {
                    ctx.translate(Math.random()*10 - 5, Math.random()*10 - 5);
                }

                // Background
                const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grad.addColorStop(0, '#001133');
                grad.addColorStop(1, '#000');
                ctx.fillStyle = grad;
                ctx.fillRect(-50, -50, canvas.width + 100, canvas.height + 100);
                
                drawCitySkyline('#0a0a0a');
                
                // Ship descending
                let shipY = Math.max(canvas.height/3, -200 + sceneT * 0.1);
                let glow = sceneT > 4000;
                drawShip(canvas.width/2, shipY, 1.5, glow, 0);

            } else if (elapsed < T.TITLE_3.e) {
                let alpha = Math.min(1, (elapsed - T.TITLE_3.s) / 500);
                if (elapsed > T.TITLE_3.e - 500) alpha = (T.TITLE_3.e - elapsed) / 500;
                drawTrailerText("GOGULF.ONLINE", "BY RABBANI'S", alpha);

            } else if (elapsed < T.BOARDING.e) {
                 // BOARDING (Beam on)
                 const sceneT = elapsed - T.BOARDING.s;
                 ctx.fillStyle = '#001133';
                 ctx.fillRect(0, 0, canvas.width, canvas.height);
                 drawCitySkyline('#050505');
                 drawShip(canvas.width/2, canvas.height/3, 1.5, true, 0); // Ship with beam
                 // Draw people moving to center
                 ctx.fillStyle = '#000';
                 for(let i=0; i<5; i++) {
                     let px = 200 + i*150;
                     // Move towards center x (640)
                     let dir = (canvas.width/2 - px) * (sceneT/7000);
                     ctx.fillRect(px + dir - 5, canvas.height - 50, 10, 30);
                 }

            } else if (elapsed < T.MONTAGE_4.e) {
                // HIGH SPEED MONTAGE
                const montageT = elapsed - T.MONTAGE_1.s;
                const phase = Math.floor(montageT / 5000); // 0 to 3
                const localT = montageT % 5000;
                
                // Fast background pan
                ctx.translate(-(localT * 0.2), 0);

                let bgColor, text;
                if(phase === 0) { bgColor = '#ffaa00'; text = "SAUDI ARABIA & QATAR"; }      // Desert
                else if(phase === 1) { bgColor = '#0055aa'; text = "DUBAI, UAE"; } // Dubai
                else if(phase === 2) { bgColor = '#883355'; text = "EUROPE"; }     // Europe
                else { bgColor = '#227744'; text = "CANADA"; }                     // Canada

                const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grad.addColorStop(0, bgColor);
                grad.addColorStop(1, '#000');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width * 2, canvas.height); // Extra width for panning
                
                drawStars(5); // Fast stars

                // Landmarks
                if(phase === 0) {
                    // Pyramids/Dunes
                    ctx.fillStyle = '#cc8800';
                    ctx.beginPath(); ctx.moveTo(500, canvas.height); ctx.lineTo(700, 300); ctx.lineTo(900, canvas.height); ctx.fill();
                } else if(phase === 1) {
                    drawBurjKhalifa(1000, 100);
                } else if(phase === 2) {
                    drawEiffelTower(1200, 200);
                } else if(phase === 3) {
                    drawCNTower(900, 100);
                }

                // Foreground ship
                // Reset translation for HUD/Ship
                ctx.restore(); ctx.save();
                drawShip(400 + Math.sin(localT/200)*10, canvas.height/2 + Math.cos(localT/300)*20, 1.2, true, 200);
                
                // Dramatic Flash at start of each cut
                if (localT < 200) {
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0,0, canvas.width, canvas.height);
                }

                // Text Overlay
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.font = 'bold 60px Impact';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'black';
                ctx.fillText(text, canvas.width/2, 100);

            } else if (elapsed < T.TITLE_4.e) {
                let alpha = Math.min(1, (elapsed - T.TITLE_4.s) / 300);
                if (elapsed > T.TITLE_4.e - 300) alpha = (T.TITLE_4.e - elapsed) / 300;
                drawTrailerText("A GLORIOUS RETURN", "", alpha);

            } else if (elapsed < T.INDIA.e) {
                // INDIA - Happy, bright
                const sceneT = elapsed - T.INDIA.s;
                
                const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grad.addColorStop(0, '#ff9933'); // Saffron
                grad.addColorStop(0.5, '#ffffff'); // White
                grad.addColorStop(1, '#138808'); // Green
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                drawTajMahal(canvas.width/2, canvas.height/2 - 50);
                drawPeople(0, 0, 'happy');

                // Ship hovering
                drawShip(canvas.width/2, 200 + Math.sin(sceneT/500)*20, 1, true, 0);
                
                ctx.fillStyle = 'black';
                ctx.font = 'bold 40px Impact';
                ctx.fillText("SUCCESS IN INDIA", canvas.width/2, 80);

            } else if (elapsed < T.DEPARTURE.e) {
                // DEPARTURE
                const sceneT = elapsed - T.DEPARTURE.s;
                
                // Background (same as India but getting darker)
                ctx.fillStyle = '#112';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                drawTajMahal(canvas.width/2, canvas.height/2 - 50);

                // Extreme shake building up
                if (sceneT < 4000) {
                    let intensity = sceneT / 200;
                    ctx.translate(Math.random()*intensity - intensity/2, Math.random()*intensity - intensity/2);
                    drawShip(canvas.width/2, 200, 1, true, sceneT / 10);
                } else if (sceneT < 4200) {
                    // FLASH BANG (Vanish)
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0,0, canvas.width, canvas.height);
                } else {
                    // Gone
                }

            } else if (elapsed < T.END_CARD.e) {
                // FINAL CONTACT CARD
                const sceneT = elapsed - T.END_CARD.s;
                let alpha = Math.min(1, sceneT / 1000);
                
                ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                if (sceneT > 1000) {
                    ctx.fillStyle = `rgba(0, 150, 255, ${(sceneT-1000)/1000})`;
                    ctx.font = 'bold 80px Impact';
                    ctx.textAlign = 'center';
                    ctx.fillText("WWW.GOGULF.ONLINE", canvas.width/2, canvas.height/2 - 20);
                    
                    ctx.fillStyle = `rgba(255, 255, 255, ${(sceneT-1500)/1000})`;
                    ctx.font = '30px Arial';
                    ctx.fillText("BROUGHT TO YOU BY RABBANI'S", canvas.width/2, canvas.height/2 + 50);
                }

            } else {
                isPlaying = false;
                uiLayer.style.display = 'flex';
                setTimeout(() => uiLayer.style.opacity = '1', 100);
                document.querySelector('h1').innerText = "REPLAY TRAILER";
            }

            ctx.restore();
            if (isPlaying) {
                animationFrameId = requestAnimationFrame(drawLoop);
            }
        }
        
        // Initial draw
        ctx.fillStyle = '#000';
        ctx.fillRect(0,0,canvas.width, canvas.height);
    </script>
</body>
</html>

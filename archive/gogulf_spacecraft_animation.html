<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoGulf.online - A Story of Hope</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #cartoonContainer {
            position: relative;
            width: 100%;
            max-width: 1000px; 
            aspect-ratio: 16 / 9;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 191, 255, 0.3);
            border: 6px solid #111;
            border-radius: 12px;
            background-color: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            transition: opacity 0.5s ease-in-out;
        }

        /* Start Screen */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            text-align: center;
        }

        #startScreen h1 {
            font-size: 3.2rem;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            background: -webkit-linear-gradient(#fff, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        #startScreen p {
            font-size: 1.3rem;
            margin-bottom: 30px;
            color: #a8c0ff;
            max-width: 80%;
        }

        #startBtn {
            padding: 16px 45px;
            font-size: 1.4rem;
            background: linear-gradient(to right, #00c6ff 0%, #0072ff 100%);
            color: #fff;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(0, 114, 255, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #startBtn:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 114, 255, 0.7);
        }

        /* Subtitle Bar */
        #subtitles {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(0, 191, 255, 0.4);
            color: #fff;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.4rem;
            text-align: center;
            width: 85%;
            display: none;
            z-index: 5;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s;
        }

        #fadeOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            opacity: 0;
            pointer-events: none;
            z-index: 8;
            transition: opacity 1s;
        }
    </style>
</head>
<body>

    <div id="cartoonContainer">
        <canvas id="cartoonCanvas"></canvas>
        <div id="fadeOverlay"></div>
        
        <div id="startScreen">
            <h1>The GoGulf.online Journey</h1>
            <p>A 5-Minute Story of Hope and Employment by Rabbani's</p>
            <button id="startBtn">Play Animation</button>
        </div>

        <div id="subtitles"></div>
    </div>

    <script>
        const canvas = document.getElementById('cartoonCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const subtitleEl = document.getElementById('subtitles');
        const fadeOverlay = document.getElementById('fadeOverlay');

        // Internal resolution for drawing
        const width = 1200;
        const height = 675;
        canvas.width = width;
        canvas.height = height;

        let animationId;
        let startTime = 0;
        let isPlaying = false;
        
        // Total duration: 5 minutes = 300,000 milliseconds
        const totalDuration = 300000; 

        // --- SCENE DEFINITIONS ---
        const scenes = {
            unhappyWorld: { start: 0, end: 45000 },
            arrival: { start: 45000, end: 90000 },
            boarding: { start: 90000, end: 140000 },
            globalJourney: { start: 140000, end: 230000 },
            returnAndVanish: { start: 230000, end: 300000 }
        };

        // --- ENTITIES ---
        const craft = { x: 600, y: -200, scale: 1, opacity: 0, beam: 0, hover: 0 };
        
        // Generate a crowd of people
        const people = Array.from({ length: 15 }, (_, i) => ({
            x: 100 + (i * 70) + Math.random() * 20,
            y: height - 80,
            state: 'sad', // 'sad', 'ascending', 'happy'
            jobType: Math.floor(Math.random() * 3), // 0: office, 1: construction, 2: medical
            opacity: 1,
            yOffset: 0
        }));

        const stars = Array.from({ length: 100 }, () => ({
            x: Math.random() * width, y: Math.random() * (height * 0.8), size: Math.random() * 2 + 0.5, twinkle: Math.random() * Math.PI * 2
        }));

        let currentSubtitle = "";
        function setSubtitle(text) {
            if (currentSubtitle !== text) {
                currentSubtitle = text;
                if (text) {
                    subtitleEl.textContent = text;
                    subtitleEl.style.display = 'block';
                    subtitleEl.style.opacity = 1;
                } else {
                    subtitleEl.style.opacity = 0;
                    setTimeout(() => { if(!currentSubtitle) subtitleEl.style.display = 'none'; }, 300);
                }
            }
        }

        function drawGloomySky(time) {
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#0a0a0c');
            gradient.addColorStop(0.5, '#1b1b24');
            gradient.addColorStop(1, '#2c303a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            stars.forEach(star => {
                const alpha = (Math.sin(time * 0.002 + star.twinkle) + 1) / 2 * 0.5;
                ctx.globalAlpha = alpha;
                ctx.beginPath(); ctx.arc(star.x, star.y, star.size, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawHopefulSky(time) {
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#00b4db');
            gradient.addColorStop(1, '#0083b0');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Sun
            ctx.fillStyle = 'rgba(255, 223, 0, 0.8)';
            ctx.beginPath(); ctx.arc(1000, 150, 60, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'rgba(255, 223, 0, 0.3)';
            ctx.beginPath(); ctx.arc(1000, 150, 100 + Math.sin(time*0.002)*10, 0, Math.PI*2); ctx.fill();
        }

        function drawCityscape(gloomy = true) {
            ctx.fillStyle = gloomy ? '#111' : '#223';
            // Simple buildings
            const buildings = [
                {x: 50, w: 120, h: 300}, {x: 200, w: 90, h: 450}, {x: 320, w: 150, h: 250},
                {x: 500, w: 100, h: 380}, {x: 650, w: 180, h: 200}, {x: 880, w: 110, h: 400},
                {x: 1020, w: 130, h: 280}
            ];

            buildings.forEach(b => {
                ctx.fillRect(b.x, height - b.h, b.w, b.h);
                // Windows
                if (!gloomy) {
                    ctx.fillStyle = '#fffae6';
                    for(let wy = height - b.h + 20; wy < height - 50; wy += 40) {
                        for(let wx = b.x + 20; wx < b.x + b.w - 20; wx += 30) {
                            if(Math.random() > 0.3) ctx.fillRect(wx, wy, 15, 20);
                        }
                    }
                    ctx.fillStyle = '#223'; // reset for next building
                } else {
                    // Very few lights in gloomy state
                    ctx.fillStyle = '#555';
                    for(let wy = height - b.h + 20; wy < height - 50; wy += 40) {
                        for(let wx = b.x + 20; wx < b.x + b.w - 20; wx += 30) {
                            if(Math.random() > 0.8) ctx.fillRect(wx, wy, 15, 20);
                        }
                    }
                    ctx.fillStyle = '#111';
                }
            });

            // Ground
            ctx.fillStyle = gloomy ? '#0a0a0a' : '#1a2a1a';
            ctx.fillRect(0, height - 80, width, 80);
        }

        function drawCraft(c, time) {
            if (c.opacity <= 0) return;
            ctx.save();
            ctx.globalAlpha = c.opacity;
            ctx.translate(c.x, c.y + c.hover);
            ctx.scale(c.scale, c.scale);

            // Beam
            if (c.beam > 0) {
                const grad = ctx.createLinearGradient(0, 0, 0, height - c.y);
                grad.addColorStop(0, 'rgba(0, 191, 255, 0.8)');
                grad.addColorStop(1, 'rgba(0, 191, 255, 0.1)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.moveTo(-60, 20);
                ctx.lineTo(-200, height);
                ctx.lineTo(200, height);
                ctx.lineTo(60, 20);
                ctx.fill();
            }

            // Ship shadow/glow
            ctx.shadowColor = '#00d2ff';
            ctx.shadowBlur = 30 + Math.sin(time*0.01)*10;

            // Main hull (Saucer)
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath(); ctx.ellipse(0, 0, 180, 45, 0, 0, Math.PI*2); ctx.fill();
            
            // Top Dome
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(173, 216, 230, 0.7)';
            ctx.beginPath(); ctx.ellipse(0, -15, 80, 40, 0, Math.PI, Math.PI*2); ctx.fill();
            
            // Rim lights
            ctx.fillStyle = '#00d2ff';
            for (let i = -140; i <= 140; i += 40) {
                ctx.beginPath(); ctx.arc(i, 5, 5, 0, Math.PI*2); ctx.fill();
            }

            // GOGULF Text
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 22px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("GOGULF.ONLINE", 0, 15);
            ctx.font = '12px Arial';
            ctx.fillStyle = '#aaa';
            ctx.fillText("by Rabbani's", 0, 30);

            // Engine Thrusters
            ctx.fillStyle = '#00d2ff';
            ctx.beginPath(); ctx.ellipse(-80, 35, 15, 8, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(80, 35, 15, 8, 0, 0, Math.PI*2); ctx.fill();

            ctx.restore();
        }

        function drawPerson(p, time) {
            if (p.opacity <= 0) return;
            ctx.save();
            ctx.globalAlpha = p.opacity;
            ctx.translate(p.x, p.y - p.yOffset);

            if (p.state === 'sad') {
                // Slouched, gray
                ctx.strokeStyle = '#555'; ctx.lineWidth = 6; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(-10, 25); ctx.stroke(); // Leg L
                ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(10, 25); ctx.stroke();  // Leg R
                
                ctx.fillStyle = '#777';
                ctx.beginPath(); ctx.roundRect(-10, -25, 20, 30, 5); ctx.fill(); // Body

                ctx.strokeStyle = '#555'; 
                ctx.beginPath(); ctx.moveTo(-10, -20); ctx.lineTo(-15, 5); ctx.stroke(); // Arm L slouched
                ctx.beginPath(); ctx.moveTo(10, -20); ctx.lineTo(15, 5); ctx.stroke(); // Arm R slouched

                ctx.fillStyle = '#999';
                ctx.beginPath(); ctx.arc(0, -35, 12, 0, Math.PI*2); ctx.fill(); // Head looking down
            } else if (p.state === 'ascending') {
                // Floating, looking up
                ctx.strokeStyle = '#2d3436'; ctx.lineWidth = 6; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(-5, 25); ctx.stroke(); 
                ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(5, 25); ctx.stroke();  
                
                ctx.fillStyle = '#0984e3'; // Turn colorful in beam
                ctx.beginPath(); ctx.roundRect(-10, -25, 20, 30, 5); ctx.fill();

                ctx.strokeStyle = '#fdcb6e'; 
                ctx.beginPath(); ctx.moveTo(-10, -20); ctx.lineTo(-20, -30); ctx.stroke(); // Arms floating up
                ctx.beginPath(); ctx.moveTo(10, -20); ctx.lineTo(20, -30); ctx.stroke(); 

                ctx.fillStyle = '#ffeaa7';
                ctx.beginPath(); ctx.arc(0, -40, 12, 0, Math.PI*2); ctx.fill(); // Head looking up
            } else if (p.state === 'happy') {
                // Standing tall, dressed for job
                ctx.strokeStyle = '#2d3436'; ctx.lineWidth = 6; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(-10, 25); ctx.stroke(); 
                ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(10, 25); ctx.stroke();  
                
                let suitColor = '#0984e3'; // Office
                if (p.jobType === 1) suitColor = '#e17055'; // Construction
                if (p.jobType === 2) suitColor = '#00cec9'; // Medical

                ctx.fillStyle = suitColor;
                ctx.beginPath(); ctx.roundRect(-10, -25, 20, 30, 5); ctx.fill();

                // Arm waving
                ctx.strokeStyle = '#fdcb6e'; 
                ctx.beginPath(); ctx.moveTo(-10, -20); ctx.lineTo(-15, 5); ctx.stroke(); 
                ctx.save(); ctx.translate(10, -20); ctx.rotate(Math.sin(time*0.01)*0.5 - 0.5);
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(15, -15); ctx.stroke(); ctx.restore();

                ctx.fillStyle = '#ffeaa7';
                ctx.beginPath(); ctx.arc(0, -35, 12, 0, Math.PI*2); ctx.fill(); 

                // Hats/Props
                if (p.jobType === 1) {
                    ctx.fillStyle = '#fdcb6e'; // Hard hat
                    ctx.beginPath(); ctx.arc(0, -38, 13, Math.PI, 0); ctx.fill();
                } else if (p.jobType === 0) {
                    ctx.fillStyle = '#2d3436'; // Briefcase
                    ctx.fillRect(-22, -2, 10, 12);
                }
            }

            ctx.restore();
        }

        function drawLandmarks(offsetX) {
            ctx.save();
            ctx.translate(offsetX, 0);

            // Ground
            ctx.fillStyle = '#c2b280'; // Sand/Earth
            ctx.fillRect(-1000, height - 60, 5000, 60);

            // Dubai (Burj Khalifa)
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(300, height - 360, 40, 300);
            ctx.fillRect(310, height - 460, 20, 100);
            ctx.fillRect(318, height - 520, 4, 60);
            ctx.fillStyle = '#34495e'; ctx.font = '20px Arial'; ctx.fillText("Dubai", 320, height - 20);

            // Saudi Arabia (Kingdom Centre)
            ctx.fillStyle = '#95a5a6';
            ctx.beginPath(); ctx.moveTo(700, height-60); ctx.lineTo(730, height-300); ctx.lineTo(770, height-300); ctx.lineTo(800, height-60); ctx.fill();
            ctx.fillStyle = '#87ceeb'; ctx.beginPath(); ctx.ellipse(750, height-250, 15, 40, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#34495e'; ctx.fillText("Saudi Arabia", 750, height - 20);

            // Qatar / Kuwait (Abstract Towers)
            ctx.fillStyle = '#7f8c8d';
            ctx.beginPath(); ctx.moveTo(1150, height-60); ctx.lineTo(1200, height-250); ctx.lineTo(1250, height-60); ctx.fill();
            ctx.fillStyle = '#34495e'; ctx.fillText("Qatar & Kuwait", 1200, height - 20);

            // Europe (Eiffel Tower)
            ctx.strokeStyle = '#555'; ctx.lineWidth = 8;
            ctx.beginPath(); ctx.moveTo(1600, height-60); ctx.lineTo(1650, height-350); ctx.lineTo(1700, height-60); ctx.stroke();
            ctx.fillRect(1620, height-200, 60, 10); ctx.fillRect(1635, height-280, 30, 8);
            ctx.fillStyle = '#34495e'; ctx.fillText("Europe", 1650, height - 20);

            // Canada (CN Tower)
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(2080, height-60, 20, 400);
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath(); ctx.ellipse(2090, height-350, 40, 15, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#34495e'; ctx.fillText("Canada", 2090, height - 20);

            ctx.restore();
        }

        function update(elapsed) {
            
            // 1. Unhappy World (0 - 45s)
            if (elapsed < scenes.unhappyWorld.end) {
                const p = elapsed / scenes.unhappyWorld.end;
                drawGloomySky(elapsed);
                drawCityscape(true);
                
                people.forEach(person => {
                    person.state = 'sad';
                    person.yOffset = 0;
                    person.opacity = 1;
                    drawPerson(person, elapsed);
                });

                if (p < 0.33) setSubtitle("Unemployment was spreading...");
                else if (p < 0.66) setSubtitle("Making hardworking people feel sad and lost.");
                else setSubtitle("The world was waiting for a miracle.");
            }

            // 2. Arrival (45s - 90s)
            else if (elapsed < scenes.arrival.end) {
                const sElapsed = elapsed - scenes.arrival.start;
                const duration = scenes.arrival.end - scenes.arrival.start;
                const p = sElapsed / duration;

                drawGloomySky(elapsed);
                drawCityscape(true);

                people.forEach(person => { drawPerson(person, elapsed); });

                craft.opacity = Math.min(1, p * 2);
                craft.y = -200 + p * 350; // Descend to y=150
                craft.hover = Math.sin(sElapsed * 0.005) * 15;
                craft.beam = 0;
                drawCraft(craft, elapsed);

                if (p < 0.5) setSubtitle("Until one night, a bright light appeared in the sky...");
                else setSubtitle("The GoGulf.online spacecraft by Rabbani's had arrived!");
            }

            // 3. Boarding (90s - 140s)
            else if (elapsed < scenes.boarding.end) {
                const sElapsed = elapsed - scenes.boarding.start;
                const duration = scenes.boarding.end - scenes.boarding.start;
                const p = sElapsed / duration;

                drawGloomySky(elapsed);
                drawCityscape(true);

                craft.y = 150;
                craft.hover = Math.sin(sElapsed * 0.005) * 15;
                craft.beam = (p < 0.8) ? 1 : 0; // Turn off beam near end

                people.forEach((person, index) => {
                    // Staggered boarding
                    const delay = index * 0.04;
                    if (p > delay) {
                        const liftP = Math.min(1, (p - delay) * 3);
                        person.state = 'ascending';
                        person.yOffset = liftP * (height - craft.y);
                        person.opacity = 1 - liftP;
                    }
                    drawPerson(person, elapsed);
                });

                if (p > 0.8) {
                    craft.y = 150 - (p-0.8)*5 * 300; // Blast off upwards
                    setSubtitle("Ready for liftoff!");
                } else {
                    setSubtitle("It beamed up the hopeful job seekers...");
                }

                drawCraft(craft, elapsed);
            }

            // 4. Global Journey (140s - 230s)
            else if (elapsed < scenes.globalJourney.end) {
                const sElapsed = elapsed - scenes.globalJourney.start;
                const duration = scenes.globalJourney.end - scenes.globalJourney.start;
                const p = sElapsed / duration;

                drawHopefulSky(elapsed);

                // Scroll landmarks left
                const offsetX = -p * 2200 + 400; 
                drawLandmarks(offsetX);

                craft.opacity = 1;
                craft.y = 100;
                craft.hover = Math.sin(sElapsed * 0.01) * 20;
                craft.beam = (p > 0.1 && p < 0.9) ? 0.4 : 0; // Gentle beam dropping people
                drawCraft(craft, elapsed);

                // Drop happy people across the scrolling landscape
                people.forEach((person, index) => {
                    // Reset positions relative to the moving landscape
                    const dropPoint = 300 + index * 120; // Spread them out
                    const screenX = dropPoint + offsetX;
                    
                    if (screenX > 0 && screenX < width) {
                        person.state = 'happy';
                        person.opacity = 1;
                        person.x = screenX;
                        person.yOffset = 0; // On ground
                        drawPerson(person, elapsed);
                    }
                });

                if (p < 0.25) setSubtitle("Whisking them away to lands of opportunity!");
                else if (p < 0.5) setSubtitle("Landing in Dubai, Saudi Arabia, Kuwait, and Qatar...");
                else if (p < 0.75) setSubtitle("Then to Europe, Canada, and beyond!");
                else setSubtitle("Delivering dream jobs and happiness!");
            }

            // 5. Return & Vanish (230s - 300s)
            else if (elapsed < scenes.returnAndVanish.end) {
                const sElapsed = elapsed - scenes.returnAndVanish.start;
                const duration = scenes.returnAndVanish.end - scenes.returnAndVanish.start;
                const p = sElapsed / duration;

                drawGloomySky(elapsed); // Back to night/India
                drawCityscape(false); // But buildings have lights now (hope)

                if (p < 0.3) {
                    craft.y = -200 + (p/0.3) * 350; // Descend back
                    craft.opacity = 1;
                    craft.beam = 0;
                    setSubtitle("The craft then returned to India on Earth...");
                } else if (p < 0.5) {
                    craft.y = 150;
                    craft.hover = Math.sin(sElapsed * 0.01) * 10;
                    craft.opacity = 1 - ((p-0.3)/0.2); // Fade out/cloak
                    setSubtitle("And vanished into the night sky...");
                } else {
                    craft.opacity = 0;
                    setSubtitle(""); // Clear standard subtitles
                    
                    // Final CTA Overlay
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, width, height);

                    ctx.textAlign = 'center';
                    
                    ctx.fillStyle = '#00d2ff';
                    ctx.shadowColor = '#00d2ff';
                    ctx.shadowBlur = 20;
                    ctx.font = 'bold 60px Arial';
                    ctx.fillText("Ready for your dream job?", width/2, height/2 - 40);

                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 80px Arial';
                    ctx.fillText("www.gogulf.online", width/2, height/2 + 60);

                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#aaa';
                    ctx.font = '30px Arial';
                    ctx.fillText("by Rabbani's", width/2, height/2 + 120);
                }

                drawCraft(craft, elapsed);
            } else {
                // Done
                isPlaying = false;
                startScreen.style.display = 'flex';
                startScreen.querySelector('h1').textContent = "Journey Complete";
                startScreen.querySelector('p').textContent = "Visit www.gogulf.online today.";
                startBtn.textContent = "Replay Animation";
            }
        }

        function animate(timestamp) {
            if (!isPlaying) return;

            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            ctx.clearRect(0, 0, width, height);

            update(elapsed);

            // Progress bar
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fillRect(0, 0, width, 6);
            ctx.fillStyle = '#00d2ff';
            ctx.fillRect(0, 0, (elapsed/totalDuration)*width, 6);

            if (elapsed < totalDuration && isPlaying) {
                animationId = requestAnimationFrame(animate);
            }
        }

        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            isPlaying = true;
            startTime = null; 
            
            // Reset states
            craft.y = -200; craft.opacity = 0; craft.beam = 0;
            people.forEach(p => { p.state = 'sad'; p.yOffset = 0; p.opacity = 1; });
            
            cancelAnimationFrame(animationId);
            animationId = requestAnimationFrame(animate);
        });

        // Initial preview draw (Scene 1)
        drawGloomySky(0);
        drawCityscape(true);
        people.forEach(p => drawPerson(p, 0));
        
    </script>
</body>
</html>
